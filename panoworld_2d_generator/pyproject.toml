[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panoworld-2d-generator"
version = "0.1.0"
description = "Training, inference, and geometric-proxy generation for the PanoWorld 2D Generator"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "torch==2.6.0",
  "torchvision==0.21.0",
  "diffusers==0.36.0",
  "transformers==4.52.4",
  "accelerate==1.10.1",
  "peft==0.17.1",
  "huggingface-hub>=0.34,<1.0",
  "safetensors==0.4.5",
  "Pillow==9.2.0",
  "numpy>=1.24,<2.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
control = ["opencv-python-headless>=4.8", "PyYAML>=6.0", "utils3d", "mmengine", "mmdet"]
train = ["tensorboard>=2.13"]

[project.scripts]
panoworld-2d-infer = "panoworld_2d_generator.infer:main"
panoworld-2d-geometric-proxy = "panoworld_2d_generator.control_generation:main"
panoworld-2d-train = "panoworld_2d_generator.train:main"

[tool.setuptools]
package-dir = {"panoworld_2d_generator" = "."}
packages = ["panoworld_2d_generator"]
